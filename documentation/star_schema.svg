<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="560" fill="#F8F9FA"/>
  <text x="40" y="38" font-size="23" font-weight="700" fill="#0B2545">TunisAssur Intelligence — Data Model</text>
  <text x="40" y="60" font-size="13" fill="#495057">Star schema · DimPolicy hub · all relationships one-to-many, single cross-filter direction · no fact-to-fact joins</text>

  <!-- ===================== relationship lines (drawn first) ===================== -->
  <g stroke="#9AA3AD" stroke-width="1.6" fill="none">
    <!-- dims -> hub -->
    <line x1="200" y1="146" x2="360" y2="242"/>
    <line x1="200" y1="221" x2="360" y2="258"/>
    <line x1="200" y1="296" x2="360" y2="278"/>
    <line x1="200" y1="371" x2="360" y2="294"/>
    <!-- hub -> facts -->
    <line x1="540" y1="250" x2="710" y2="177"/>
    <line x1="540" y1="268" x2="710" y2="267"/>
    <line x1="540" y1="286" x2="710" y2="357"/>
  </g>
  <!-- DimDate -> facts (conformed) -->
  <g stroke="#2A6F97" stroke-width="1.6" fill="none">
    <line x1="735" y1="440" x2="795" y2="204"/>
    <line x1="735" y1="440" x2="795" y2="294"/>
    <line x1="735" y1="440" x2="795" y2="384"/>
  </g>

  <!-- cardinality glyphs -->
  <g font-size="12" fill="#6C757D" font-weight="700">
    <text x="210" y="142">1</text><text x="210" y="217">1</text><text x="210" y="292">1</text><text x="210" y="367">1</text>
    <text x="345" y="238">∗</text><text x="345" y="300">∗</text>
    <text x="548" y="246">1</text><text x="690" y="173">∗</text><text x="690" y="263">∗</text><text x="690" y="353">∗</text>
    <text x="728" y="430">1</text><text x="778" y="214">∗</text>
  </g>
  <text x="250" y="340" font-size="10" fill="#6C757D" font-style="italic" transform="rotate(-14 250 340)">InsuredAssetID</text>
  <text x="602" y="430" font-size="10" fill="#2A6F97" font-style="italic">ClaimDate active · Approval/Closure inactive (USERELATIONSHIP)</text>

  <!-- ===================== dimension boxes ===================== -->
  <g>
    <rect x="50" y="120" width="150" height="52" rx="8" fill="#2A9D8F"/>
    <text x="125" y="151" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">DimCustomer</text>
    <rect x="50" y="195" width="150" height="52" rx="8" fill="#2A9D8F"/>
    <text x="125" y="226" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">DimProduct</text>
    <rect x="50" y="270" width="150" height="52" rx="8" fill="#2A9D8F"/>
    <text x="125" y="301" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">DimBranch</text>
    <rect x="50" y="345" width="150" height="52" rx="8" fill="#2A9D8F"/>
    <text x="125" y="376" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">DimVehicle</text>
  </g>

  <!-- ===================== hub ===================== -->
  <rect x="360" y="230" width="180" height="76" rx="10" fill="#0B2545"/>
  <text x="450" y="263" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">DimPolicy</text>
  <text x="450" y="285" font-size="11" fill="#9EC5E6" text-anchor="middle">central hub</text>

  <!-- ===================== fact boxes ===================== -->
  <g>
    <rect x="710" y="150" width="170" height="54" rx="8" fill="#E76F51"/>
    <text x="795" y="182" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">FactPremiums</text>
    <rect x="710" y="240" width="170" height="54" rx="8" fill="#E76F51"/>
    <text x="795" y="272" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">FactClaims</text>
    <rect x="710" y="330" width="170" height="54" rx="8" fill="#E76F51"/>
    <text x="795" y="362" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">FactPayments</text>
  </g>

  <!-- ===================== date dimension ===================== -->
  <rect x="650" y="440" width="170" height="50" rx="8" fill="#264653"/>
  <text x="735" y="470" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">DimDate</text>

  <!-- ===================== legend ===================== -->
  <g font-size="12" fill="#333">
    <rect x="50" y="470" width="18" height="14" rx="3" fill="#2A9D8F"/><text x="74" y="482">Dimension</text>
    <rect x="160" y="470" width="18" height="14" rx="3" fill="#0B2545"/><text x="184" y="482">Hub</text>
    <rect x="240" y="470" width="18" height="14" rx="3" fill="#E76F51"/><text x="264" y="482">Fact</text>
    <rect x="320" y="470" width="18" height="14" rx="3" fill="#264653"/><text x="344" y="482">Date (conformed)</text>
  </g>
  <text x="50" y="515" font-size="11" fill="#6C757D">Premiums · Claims · Payments each aggregate independently; cross-process KPIs (Loss Ratio) are measures, never fact-to-fact joins.</text>
</svg>
